# Build the browser version (rust/build-web.sh) and publish rust/web to GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions"
# (or: gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Build web/enfusia-tunnel.wasm
        run: sh rust/build-web.sh
      - name: Sizes
        run: |
          ls -l rust/web
          echo "wasm gzip -9: $(gzip -9c rust/web/enfusia-tunnel.wasm | wc -c) bytes"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: rust/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
