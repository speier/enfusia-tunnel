<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENFUSiA - tunnel intro by SPeY (2002), ported to Rust</title>
  <link rel="icon" href="favicon.ico">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; background: #000; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <script src="mq_js_bundle.js"></script>
  <script src="audio.js"></script>
  <script>
    // note: mq_js_bundle.js already defines a global `canvas`, so use another name here
    const glCanvas = document.getElementById("glcanvas");
    glCanvas.focus();
    // Fullscreen must be requested inside a real user-gesture handler, so it lives here.
    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (glCanvas.requestFullscreen) glCanvas.requestFullscreen().catch(() => {});
    }
    window.addEventListener("keydown", (e) => {
      if (e.repeat) return;
      if (e.key === "f" || e.key === "F" || (e.key === "Enter" && e.altKey)) toggleFullscreen();
    });
    glCanvas.addEventListener("dblclick", toggleFullscreen);
    // one self-contained wasm: code, texture, font, NFO and music.s3m (see audio.js)
    enfLoad("enfusia-tunnel.wasm");
  </script>
</body>
</html>
