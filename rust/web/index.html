<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ENFUSiA - tunnel intro by SPeY (2002), ported to Rust</title>
  <link rel="icon" href="favicon.ico">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* position: fixed + inset 0 follows the visible viewport on phones (100vh does not) */
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none;
             background: #000; touch-action: none; -webkit-user-select: none; user-select: none;
             -webkit-tap-highlight-color: transparent; }
    #fs { position: fixed; z-index: 10; top: max(12px, env(safe-area-inset-top));
          right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px; padding: 10px;
          box-sizing: border-box; border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.35);
          color: rgba(255,255,255,.85); cursor: pointer; opacity: 0; visibility: hidden;
          transition: opacity .3s, visibility .3s; }
    #fs.show { opacity: 1; visibility: visible; }
    #fs:hover { color: #fff; border-color: #fff; }
    #fs svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <button id="fs" type="button" tabindex="-1" title="Fullscreen (F)" aria-label="Fullscreen">
    <!-- four blocky corners, like CP437 box drawing -->
    <svg viewBox="0 0 8 8" fill="currentColor" aria-hidden="true">
      <path d="M0 0h3v1H1v2H0zM5 0h3v3H7V1H5zM0 5h1v2h2v1H0zM7 5h1v3H5V7h2z"/>
    </svg>
  </button>
  <!-- build-web.sh adds ?v=<build hash> to these, and audio.js passes it on to the wasm -->
  <script src="mq_js_bundle.js"></script>
  <script src="audio.js"></script>
  <script>
    // note: mq_js_bundle.js already defines a global `canvas`, so use another name here
    const glCanvas = document.getElementById("glcanvas");
    const fsButton = document.getElementById("fs");
    glCanvas.focus();

    // --- fullscreen: F, Alt+Enter, double-click or the corner button --------------------
    // It must be requested inside a real user-gesture handler, so it lives here, not in Rust.
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    // the whole page goes fullscreen (not just the canvas), so the corner button stays usable
    const fsRoot = document.documentElement;
    const fsRequest = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
    const fsExit = document.exitFullscreen || document.webkitExitFullscreen;
    function toggleFullscreen() {
      try {
        const p = fsElement() ? fsExit.call(document) : fsRequest.call(fsRoot);
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* not allowed here: ignore */ }
    }
    // Esc in browser fullscreen only leaves fullscreen (the browser does that itself). The
    // intro must not also see that Esc and jump back to the start screen, whether the key
    // event arrives while still in fullscreen or just after the fullscreenchange.
    let fsExitAt = -1e9;
    for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) {
      document.addEventListener(ev, () => {
        if (!fsElement()) fsExitAt = performance.now();
        glCanvas.focus();
      });
    }
    // Every key goes through here first (capture phase, before miniquad's canvas handler).
    let focusAt = -1e9;
    window.addEventListener("focus", () => { focusAt = performance.now(); });
    window.addEventListener("keydown", (e) => {
      // keep it from the intro, but leave the browser's own shortcuts (Cmd+R, ...) alone
      const drop = () => { e.stopImmediatePropagation(); };
      // Esc in fullscreen only leaves fullscreen; whether the key arrives while still in
      // fullscreen or just after the fullscreenchange, the intro must not also see it
      if (e.key === "Escape" && (fsElement() || performance.now() - fsExitAt < 500)) {
        drop();
        e.preventDefault();
        if (fsElement()) toggleFullscreen();
        return;
      }
      if (e.repeat) return drop();
      if (!e.ctrlKey && !e.metaKey && ((e.key === "f" || e.key === "F") || (e.key === "Enter" && e.altKey))) {
        toggleFullscreen();
      }
      // a key that arrives right after the window got focus back (Cmd+Tab, Alt+Tab) or with a
      // modifier held is not for the intro (main.rs also ignores Cmd / Ctrl / Alt)
      if (performance.now() - focusAt < 300 || e.ctrlKey || e.metaKey || e.altKey) return drop();
    }, true);
    // miniquad has no key code for Cmd / Windows keys and would log every keyup of one
    window.addEventListener("keyup", (e) => { if (e.key === "Meta" || e.key === "OS") e.stopImmediatePropagation(); }, true);
    glCanvas.addEventListener("dblclick", toggleFullscreen);

    // the corner button: shown on mouse move / touch, hidden again after 2 s idle
    if (fsRequest) {
      let hideTimer = 0;
      const showButton = () => {
        fsButton.classList.add("show");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => fsButton.classList.remove("show"), 2000);
      };
      for (const ev of ["mousemove", "touchstart"]) window.addEventListener(ev, showButton, { passive: true });
      fsButton.addEventListener("mousedown", (e) => e.preventDefault()); // keep keyboard focus on the canvas
      fsButton.addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); showButton(); glCanvas.focus(); });
    } else {
      fsButton.remove(); // e.g. iPhone Safari: no element fullscreen
    }

    // one self-contained wasm: code, texture, font, NFO and music.s3m (see audio.js)
    enfLoad("enfusia-tunnel.wasm");
  </script>
</body>
</html>
